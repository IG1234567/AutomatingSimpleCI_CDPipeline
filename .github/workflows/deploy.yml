name: Deploy knowledge base

on:
  push:
    branches: [main]
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "LICENSE.txt"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Emergency force deployment (skips the test job)"
        type: boolean
        default: false

# Only the most recent run is allowed; older queued or running ones are cancelled
concurrency:
  group: knowledge-base-deploy
  cancel-in-progress: true

# Least privilege by default; jobs request only what they need
permissions:
  contents: read

# The scripts below are written for bash (also on Windows self-hosted runners)
defaults:
  run:
    shell: bash

jobs:
  test:
    if: ${{ !inputs.force }}
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      URL_CHECKER_TIMEOUT: ${{ vars.URL_CHECKER_TIMEOUT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Cache node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: npm ci

      - name: Lint
        run: npm run lint:all

      - name: Run scripts
        run: |
          for f in script/*.js; do
            case "$f" in
              */url-checker.js) node "$f" -t "${URL_CHECKER_TIMEOUT:-5}" ;;
              *) node "$f" ;;
            esac
          done

  build:
    needs: test
    # Run when tests passed, or when tests were skipped by a forced deployment
    if: ${{ !cancelled() && (needs.test.result == 'success' || (needs.test.result == 'skipped' && inputs.force)) }}
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Cache node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: npm ci

      - name: Build site
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/
        run: npm run prod

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: [test, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: built-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deployment status
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "$GITHUB_TOKEN" | gh auth login --with-token
          if [ "$OUTCOME" = "success" ]; then STATUS="succeeded"; else STATUS="failed"; fi
          gh issue create \
            --repo "$REPOSITORY" \
            --title "$(date -u +%F) - Deployment: $STATUS" \
            --body "URL: $PAGE_URL"
